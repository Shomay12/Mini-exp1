<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="application-name" content="WEB INTELLIGENCE ENGINE" />
  <title>Research Workbench</title>
  <link rel="stylesheet" href="/static/styles/tokens.css" />
  <link rel="stylesheet" href="/static/styles/layout.css" />
  <link rel="stylesheet" href="/static/styles/components.css" />
</head>
<body>
  <a class="skip-link" href="#workspace-main">Skip to Workspace</a>

  <div id="app-shell" class="app-shell" data-compact-pane="workspace">
    <header class="app-toolbar" role="banner">
      <div class="toolbar-group toolbar-group--leading">
        <button
          id="btn-toggle-sidebar"
          class="btn btn--quiet btn--icon"
          type="button"
          aria-label="Toggle history sidebar"
          aria-pressed="true"
          title="Toggle Sidebar (⌘\)"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2"></rect>
            <line x1="7.5" y1="3.5" x2="7.5" y2="16.5"></line>
          </svg>
        </button>

        <h1 id="toolbar-run-title" class="toolbar-title">New Research</h1>

        <div class="segmented toolbar-hide-compact" role="tablist" aria-label="Mode">
          <button
            id="mode-research"
            class="segmented__item"
            type="button"
            role="tab"
            aria-selected="true"
            data-mode="research"
          >
            Research
          </button>
          <button
            id="mode-search"
            class="segmented__item"
            type="button"
            role="tab"
            aria-selected="false"
            data-mode="search"
          >
            Search
          </button>
        </div>
      </div>

      <div class="toolbar-group toolbar-group--trailing">
        <span id="toolbar-engine-status" class="status-label toolbar-hide-compact" title="Backend engine status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Connecting…</span>
        </span>

        <span id="toolbar-budget-label" class="toolbar-meta toolbar-hide-compact" title="Estimated evidence tokens vs configured context budget">
          0 / 7,168 tok
        </span>

        <button
          id="btn-export-json"
          class="btn btn--quiet"
          type="button"
          disabled
          title="Export JSON (⌘E)"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 3.5v8.5"></path>
            <path d="m6.8 6.8 3.2-3.3 3.2 3.3"></path>
            <path d="M4 12.5v2.8a1.2 1.2 0 0 0 1.2 1.2h9.6a1.2 1.2 0 0 0 1.2-1.2v-2.8"></path>
          </svg>
          <span class="toolbar-hide-compact">Export</span>
        </button>

        <button
          id="btn-toggle-inspector"
          class="btn btn--quiet btn--icon"
          type="button"
          aria-label="Toggle inspector"
          aria-pressed="true"
          title="Toggle Inspector (⌥⌘I)"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2"></rect>
            <line x1="12.5" y1="3.5" x2="12.5" y2="16.5"></line>
          </svg>
        </button>

        <button
          id="btn-open-settings"
          class="btn btn--quiet btn--icon"
          type="button"
          aria-label="Configuration"
          title="Settings… (⌘,)"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <line x1="4" y1="6" x2="16" y2="6"></line>
            <circle cx="7.5" cy="6" r="1.8" fill="var(--surface-canvas)"></circle>
            <line x1="4" y1="10.5" x2="16" y2="10.5"></line>
            <circle cx="13" cy="10.5" r="1.8" fill="var(--surface-canvas)"></circle>
            <line x1="4" y1="15" x2="16" y2="15"></line>
            <circle cx="9" cy="15" r="1.8" fill="var(--surface-canvas)"></circle>
          </svg>
        </button>
      </div>
    </header>

    <nav class="compact-pane-bar" aria-label="Workspace panes">
      <div class="segmented segmented--full" role="tablist">
        <button class="segmented__item" type="button" role="tab" aria-selected="true" data-compact-tab="workspace">Workspace</button>
        <button class="segmented__item" type="button" role="tab" aria-selected="false" data-compact-tab="history">History</button>
        <button class="segmented__item" type="button" role="tab" aria-selected="false" data-compact-tab="inspector">Inspector</button>
      </div>
    </nav>

    <div class="split-workspace">
      <aside id="pane-sidebar" class="pane-sidebar" aria-label="History">
        <div class="sidebar-header">
          <button id="btn-new-research" class="btn" type="button" title="New Research (⌘N)">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
              <line x1="10" y1="4.5" x2="10" y2="15.5"></line>
              <line x1="4.5" y1="10" x2="15.5" y2="10"></line>
            </svg>
            <span>New</span>
          </button>

          <div class="search-field">
            <svg class="icon icon--sm search-field__icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5"></circle>
              <line x1="10.5" y1="10.5" x2="14" y2="14"></line>
            </svg>
            <input
              id="sidebar-search"
              class="search-field__input"
              type="search"
              placeholder="Filter runs…"
              aria-label="Filter runs"
              autocomplete="off"
            />
            <button
              id="sidebar-search-clear"
              class="search-field__clear"
              type="button"
              aria-label="Clear filter"
              hidden
            >
              ×
            </button>
          </div>
        </div>

        <div class="sidebar-section-label">History</div>
        <div id="sidebar-history-list" class="sidebar-list" role="list"></div>
      </aside>

      <div
        class="split-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize history sidebar"
        tabindex="0"
        data-resizer="sidebar"
      ></div>

      <main id="workspace-main" class="pane-workspace" tabindex="-1">
        <div id="workspace-scroll" class="workspace-scroll">
          <div id="workspace-root" class="workspace-column"></div>
        </div>
      </main>

      <div
        class="split-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize inspector"
        tabindex="0"
        data-resizer="inspector"
      ></div>

      <aside id="pane-inspector" class="pane-inspector" aria-label="Inspector">
        <div class="inspector-head">
          <div class="inspector-head__top">
            <h2 class="inspector-head__title">Inspector</h2>
            <span id="inspector-summary-count" class="doc-section__sub"></span>
          </div>
          <div class="segmented segmented--full" role="tablist" aria-label="Inspector sections">
            <button class="segmented__item" type="button" role="tab" aria-selected="true" data-inspector-tab="sources">Sources</button>
            <button class="segmented__item" type="button" role="tab" aria-selected="false" data-inspector-tab="passages">Passages</button>
            <button class="segmented__item" type="button" role="tab" aria-selected="false" data-inspector-tab="conflicts">Conflicts</button>
            <button class="segmented__item" type="button" role="tab" aria-selected="false" data-inspector-tab="context">Context</button>
            <button class="segmented__item" type="button" role="tab" aria-selected="false" data-inspector-tab="generation" title="Model Registry &amp; Generation Inspector">Gen</button>
            <button class="segmented__item" type="button" role="tab" aria-selected="false" data-inspector-tab="audit">Audit</button>
          </div>
        </div>
        <div id="inspector-body" class="inspector-body"></div>
      </aside>
    </div>
  </div>

  <dialog id="settings-dialog" class="app-sheet" aria-labelledby="settings-dialog-title">
    <div id="settings-sheet-root" class="sheet-shell"></div>
  </dialog>

  <dialog id="confirm-delete-dialog" class="app-sheet app-sheet--narrow" aria-labelledby="confirm-delete-title">
    <div class="sheet-shell">
      <div class="sheet-header">
        <h2 id="confirm-delete-title" class="sheet-title">Delete Research Run?</h2>
      </div>
      <div class="sheet-body">
        <p id="confirm-delete-message" class="coverage-summary-text">
          This removes the persisted run, sources, passages, and conflicts from local storage.
        </p>
      </div>
      <div class="sheet-footer">
        <button id="btn-cancel-delete" class="btn" type="button">Cancel</button>
        <button id="btn-confirm-delete" class="btn btn--destructive" type="button">Delete</button>
      </div>
    </div>
  </dialog>

  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
